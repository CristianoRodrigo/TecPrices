<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Periféricos - TecPrices</title>
<style>
  /* Reset */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #2e2e2e;
    color: #eee;
    display: flex;
    min-height: 100vh;
  }

  /* Menu lateral fixo */
  nav {
    width: 200px;
    background-color: #111;
    padding: 20px;
    position: fixed;
    height: 100vh;
    overflow-y: auto;
  }
  nav h1 {
    color: #27ae60;
    margin-bottom: 30px;
    font-size: 1.8rem;
    text-align: center;
  }
  nav ul {
    list-style: none;
    padding-left: 0;
  }
  nav ul li {
    margin: 15px 0;
  }
  nav ul li a {
    color: #ccc;
    text-decoration: none;
    font-weight: 600;
    display: block;
    padding: 8px 10px;
    border-radius: 4px;
    transition: background 0.2s ease;
  }
  nav ul li a:hover {
    background: #27ae60;
    color: #111;
  }

  /* Conteúdo principal */
  main {
    margin-left: 200px;
    padding: 20px 40px;
    flex-grow: 1;
    max-width: 1000px;
  }

  /* Cabeçalho grande neon */
  .header-neon {
    font-size: 6rem;
    font-weight: 900;
    text-align: center;
    letter-spacing: 10px;
    color: #ff1aff;
    text-shadow:
      0 0 5px #ff1aff,
      0 0 10px #ff1aff,
      0 0 20px #ff1aff,
      0 0 40px #ff1aff;
    margin-bottom: 40px;
  }

  /* Seção introdutória */
  .intro {
    max-width: 600px;
    margin: 0 auto 40px auto;
    text-align: center;
    font-size: 1rem;
    line-height: 1.5;
    color: #bbb;
  }

  /* Botões estilo simples */
  .button-group {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 50px;
  }
  .button-group button {
    background-color: transparent;
    border: 2px solid #27ae60;
    border-radius: 6px;
    color: #27ae60;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .button-group button:hover {
    background-color: #27ae60;
    color: #111;
  }

  /* Grid para imagens sem nomes */
  .imagens-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 25px;
  }

  .imagem-card {
    background-color: #222;
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 0 16px #27ae6055;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .imagem-card img {
    width: 100%;
    max-width: 180px;
    height: auto;
    object-fit: contain;
    border-radius: 6px;
    user-select: none;
  }

</style>
</head>

<body>
<nav aria-label="Menu lateral TecPrices">
  <h1>TecPrices</h1>
  <ul>
    <li><a href="#">Início</a></li>
    <li><a href="#">Requisitos de jogos</a></li>
    <li><a href="#">Teste de desempenho</a></li>
    <li><a href="#">Computadores</a></li>
    <li><a href="#" style="color:#27ae60;">Periféricos</a></li>
    <li><a href="#">Monte seu Setup</a></li>
    <li><a href="#">Sobre nós</a></li>
  </ul>
</nav>

<main>
  <h2 class="header-neon">PERIFÉRICOS</h2>

  <p class="intro">
    Qualquer periférico você encontra aqui pelos melhores preços!
  </p>

  <div class="button-group" role="group" aria-label="Categorias de periféricos">
    <button>Teclados</button>
    <button>Mouses</button>
    <button>Mousepads</button>
    <button>Headsets</button>
  </div>

  <section aria-label="Teclados destaque sem nomes">
    <div class="imagens-grid" role="list">
      <div class="imagem-card" role="listitem" tabindex="0">
        <img src="https://i.imgur.com/DXgXPDJ.jpg" alt="Imagem de teclado tradicional" />
      </div>
      <div class="imagem-card" role="listitem" tabindex="0">
        <img src="https://i.imgur.com/xJpBQyZ.jpg" alt="Imagem de teclado mecânico" />
      </div>
      <div class="imagem-card" role="listitem" tabindex="0">
        <img src="https://i.imgur.com/4Ah24At.jpg" alt="Imagem de teclado gamer RGB" />
      </div>
      <div class="imagem-card" role="listitem" tabindex="0">
        <img src="https://i.imgur.com/28bJ5EY.jpg" alt="Imagem de teclado compacto" />
      </div>
    </div>
  </section>

  <!-- Exemplo com outros teclados -->
  <section aria-label="Exemplos de teclados">
    <div class="imagens-grid" style="margin-top: 50px;">
      <div class="imagem-card" role="listitem" tabindex="0">
        <img src="https://i.imgur.com/HFm9RmS.jpg" alt="Teclado Razer BlackWidow Tournament V2" />
      </div>
      <div class="imagem-card" role="listitem" tabindex="0">
        <img src="https://i.imgur.com/h9eDwKS.jpg" alt="Teclado Pichau PA21 RGB" />
      </div>
      <div class="imagem-card" role="listitem" tabindex="0">
        <img src="https://i.imgur.com/7RpSv6K.jpg" alt="Teclado HyperX Alloy Core" />
      </div>
    </div>
  </section>

</main>

</body>

</html>
